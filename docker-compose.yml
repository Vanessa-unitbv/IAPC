# RAG platform: Spring Boot + Spring AI microservices (one container per story)
# Infrastructure: Eureka (discovery), Spring Cloud Gateway (entry), PostgreSQL + pgvector
#
# Usage:
#   cp .env.example .env     # then edit the values
#   docker compose up --build -d
#   docker compose ps
#
# Every service is reached through the gateway: http://localhost:8080/<service-name>/...
#   e.g. POST http://localhost:8080/ingest-static/ingest/static/run
#
# The services read the same variable names as when they run locally (see .env.example),
# so the environment blocks below only pass values through and set what differs inside Docker.

name: rag-platform

# ---------- Reusable blocks ----------

x-base-env: &base-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  # Every service listens on 8080 inside its container (the healthcheck below relies on it).
  SERVER_PORT: "8080"
  EUREKA_URL: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

# Env shared by every service that talks to pgvector and the LLM/embedding API.
x-rag-env: &rag-env
  <<: *base-env
  POSTGRES_HOST: "pgvector"
  # Port inside the Docker network; POSTGRES_PORT in .env is only the port published on localhost.
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "${POSTGRES_DB}"
  POSTGRES_USER: "${POSTGRES_USER}"
  POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
  # Any OpenAI-compatible API.
  LLM_API_KEY: "${LLM_API_KEY:?Set LLM_API_KEY in .env}"
  # Must include /v1 for OpenAI (official SDK); otherwise every LLM/embedding call is a 404.
  LLM_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com/v1}"
  CHAT_MODEL: "${CHAT_MODEL:-gpt-4o-mini}"
  # Must match the embedding model's output size. Changing the model means re-indexing.
  EMBEDDING_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"
  EMBEDDING_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
  # Only ingest-static creates the vector_store table, so the services never race to create it at startup.
  SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "false"

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 40s

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [rag-net]
  mem_limit: 768m
  healthcheck: *healthcheck

# ---------- Services ----------

services:

  # ----- Infrastructure -----

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: unless-stopped
    networks: [rag-net]
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only, for DBeaver/psql and for services run from the IDE.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    image: rag/eureka-server:latest
    container_name: eureka-server
    environment:
      <<: *base-env
      SERVER_PORT: "8761"
    ports:
      # Dashboard on localhost only.
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    image: rag/api-gateway:latest
    container_name: api-gateway
    environment:
      <<: *base-env
    ports:
      # localhost only: the endpoints spend the LLM key, so they must not be reachable from the network.
      - "127.0.0.1:${GATEWAY_PORT:-8080}:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

  # ----- RAG epic: one container per story -----

  # Story 1: static ingestion (user-managed PDFs)
  ingest-static:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ingest-static
    image: rag/ingest-static:latest
    container_name: ingest-static
    environment:
      <<: *rag-env
      # The only service that creates the vector_store table.
      SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "true"
      INGEST_RESOURCES_DIR: "/data/resources"
      CHUNK_SIZE: "${CHUNK_SIZE:-800}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-100}"
    volumes:
      # External resource folder managed by the user, outside the automation.
      - ./resources:/data/resources:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy

  # Story 2: dynamic ingestion (Internet, versions, webhooks, watcher)
  ingest-dynamic:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ingest-dynamic
    image: rag/ingest-dynamic:latest
    container_name: ingest-dynamic
    environment:
      <<: *rag-env
      INGEST_RESOURCES_DIR: "/data/resources"
      # Verified with HMAC on every vendor webhook.
      VENDOR_WEBHOOK_SECRET: "${VENDOR_WEBHOOK_SECRET:?Set VENDOR_WEBHOOK_SECRET in .env}"
      # Only these domains may be fetched. Private IP ranges must be blocked in code (SSRF).
      INGEST_ALLOWED_DOMAINS: "${INGEST_ALLOWED_DOMAINS:-}"
      INGEST_MAX_SIZE_MB: "${INGEST_MAX_SIZE_MB:-20}"
      INGEST_TIMEOUT_SECONDS: "${INGEST_TIMEOUT_SECONDS:-20}"
      CHUNK_SIZE: "${CHUNK_SIZE:-800}"
      CHUNK_OVERLAP: "${CHUNK_OVERLAP:-100}"
    volumes:
      - ./resources:/data/resources:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      ingest-static:
        condition: service_healthy

  # Story 3: pre-retrieval (filters, normalization, expansion)
  retrieval-pre:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: retrieval-pre
    image: rag/retrieval-pre:latest
    container_name: retrieval-pre
    environment:
      <<: *rag-env
      RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-20}"
      SIMILARITY_THRESHOLD: "${SIMILARITY_THRESHOLD:-0.70}"
      QUERY_EXPANSION_VARIANTS: "${QUERY_EXPANSION_VARIANTS:-3}"
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      ingest-static:
        condition: service_healthy

  # Story 4: post-retrieval (rerank, stitching, citations, evaluation)
  retrieval-post:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: retrieval-post
    image: rag/retrieval-post:latest
    container_name: retrieval-post
    environment:
      <<: *rag-env
      RERANK_TOP_K: "${RERANK_TOP_K:-5}"
      STITCH_TOKEN_BUDGET: "${STITCH_TOKEN_BUDGET:-2000}"
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      ingest-static:
        condition: service_healthy

# ---------- Network and storage ----------

networks:
  rag-net:
    driver: bridge

volumes:
  pgdata:
