# RAG platform: Spring Boot + Spring AI microservices (one container per story)
# Infrastructure: Eureka (discovery), Spring Cloud Gateway (entry), PostgreSQL + pgvector
#
# Usage:
#   cp .env.example .env     # then edit the values
#   docker compose up --build -d
#   docker compose ps
#
# Expected repo layout (Maven multi-module, module names = folder names):
#   eureka-server/  api-gateway/  ingest-static/  ingest-dynamic/
#   retrieval-pre/  retrieval-post/  pom.xml  Dockerfile

name: rag-platform

# ---------- Reusable blocks ----------

x-base-env: &base-env
  JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=75"
  EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: "http://eureka-server:8761/eureka/"
  EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"

# Env shared by every service that talks to pgvector and the LLM/embedding API.
# Only ingest-static creates the vector_store table (see PGVECTOR_INITIALIZE_SCHEMA),
# so the four services never race to create it at startup.
x-rag-env: &rag-env
  <<: *base-env
  SPRING_DATASOURCE_URL: "jdbc:postgresql://pgvector:5432/${POSTGRES_DB}"
  SPRING_DATASOURCE_USERNAME: "${POSTGRES_USER}"
  SPRING_DATASOURCE_PASSWORD: "${POSTGRES_PASSWORD}"
  SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "false"
  SPRING_AI_VECTORSTORE_PGVECTOR_INDEX_TYPE: "HNSW"
  SPRING_AI_VECTORSTORE_PGVECTOR_DISTANCE_TYPE: "COSINE_DISTANCE"
  # Must match the embedding model's output size. Changing the model means re-indexing.
  SPRING_AI_VECTORSTORE_PGVECTOR_DIMENSIONS: "${EMBEDDING_DIMENSIONS:-1536}"
  # Default provider: any OpenAI-compatible API. Swap for another Spring AI starter if needed.
  SPRING_AI_OPENAI_API_KEY: "${LLM_API_KEY:?Set LLM_API_KEY in .env}"
  SPRING_AI_OPENAI_BASE_URL: "${LLM_BASE_URL:-https://api.openai.com}"
  SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL: "${CHAT_MODEL:-gpt-4o-mini}"
  SPRING_AI_OPENAI_EMBEDDING_OPTIONS_MODEL: "${EMBEDDING_MODEL:-text-embedding-3-small}"

x-healthcheck: &healthcheck
  test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
  interval: 15s
  timeout: 5s
  retries: 8
  start_period: 40s

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [rag-net]
  mem_limit: 768m
  healthcheck: *healthcheck

# ---------- Services ----------

services:

  # ----- Infrastructure -----

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: pgvector
    restart: unless-stopped
    networks: [rag-net]
    environment:
      POSTGRES_DB: "${POSTGRES_DB}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    ports:
      # Bound to localhost only, for DBeaver/psql during development.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  eureka-server:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: eureka-server
    image: rag/eureka-server:latest
    container_name: eureka-server
    environment:
      <<: *base-env
      SERVER_PORT: "8761"
      EUREKA_CLIENT_REGISTER_WITH_EUREKA: "false"
      EUREKA_CLIENT_FETCH_REGISTRY: "false"
    ports:
      # Dashboard on localhost only.
      - "127.0.0.1:8761:8761"
    healthcheck:
      <<: *healthcheck
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep -q UP"]

  api-gateway:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: api-gateway
    image: rag/api-gateway:latest
    container_name: api-gateway
    environment:
      <<: *base-env
      # Routes are created from Eureka: /ingest-static/**, /retrieval-pre/**, ...
      # Spring Cloud 2025.1 (Gateway 5.x) uses the spring.cloud.gateway.server.webflux prefix.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_ENABLED: "true"
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_DISCOVERY_LOCATOR_LOWER_CASE_SERVICE_ID: "true"
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    depends_on:
      eureka-server:
        condition: service_healthy

  # ----- RAG epic: one container per story -----

  # Story 1: static ingestion (user-managed PDFs)
  ingest-static:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ingest-static
    image: rag/ingest-static:latest
    container_name: ingest-static
    environment:
      <<: *rag-env
      # The only service that creates the vector_store table.
      SPRING_AI_VECTORSTORE_PGVECTOR_INITIALIZE_SCHEMA: "true"
      APP_RESOURCES_PATH: "/data/resources"
      APP_CHUNK_SIZE: "${CHUNK_SIZE:-800}"
      APP_CHUNK_OVERLAP: "${CHUNK_OVERLAP:-100}"
    volumes:
      # External resource folder managed by the user, outside the automation.
      - ./resources:/data/resources:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy

  # Story 2: dynamic ingestion (Internet, versions, webhooks, watcher)
  ingest-dynamic:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: ingest-dynamic
    image: rag/ingest-dynamic:latest
    container_name: ingest-dynamic
    environment:
      <<: *rag-env
      APP_RESOURCES_PATH: "/data/resources"
      # Verified with HMAC on every vendor webhook.
      APP_WEBHOOK_SECRET: "${VENDOR_WEBHOOK_SECRET:?Set VENDOR_WEBHOOK_SECRET in .env}"
      # Only these domains may be fetched. Private IP ranges must be blocked in code (SSRF).
      APP_INGEST_ALLOWED_DOMAINS: "${INGEST_ALLOWED_DOMAINS:-}"
      APP_INGEST_MAX_SIZE_MB: "${INGEST_MAX_SIZE_MB:-20}"
      APP_INGEST_BLOCK_PRIVATE_NETWORKS: "true"
    volumes:
      - ./resources:/data/resources:ro
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      ingest-static:
        condition: service_healthy

  # Story 3: pre-retrieval (filters, normalization, expansion)
  retrieval-pre:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: retrieval-pre
    image: rag/retrieval-pre:latest
    container_name: retrieval-pre
    environment:
      <<: *rag-env
      APP_RETRIEVAL_TOP_K: "${RETRIEVAL_TOP_K:-20}"
      APP_RETRIEVAL_SIMILARITY_THRESHOLD: "${SIMILARITY_THRESHOLD:-0.70}"
      APP_QUERY_EXPANSION_VARIANTS: "${QUERY_EXPANSION_VARIANTS:-3}"
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      ingest-static:
        condition: service_healthy

  # Story 4: post-retrieval (rerank, stitching, citations, evaluation)
  retrieval-post:
    <<: *service-defaults
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: retrieval-post
    image: rag/retrieval-post:latest
    container_name: retrieval-post
    environment:
      <<: *rag-env
      APP_RERANK_TOP_K: "${RERANK_TOP_K:-5}"
      APP_STITCH_TOKEN_BUDGET: "${STITCH_TOKEN_BUDGET:-2000}"
    depends_on:
      eureka-server:
        condition: service_healthy
      pgvector:
        condition: service_healthy
      ingest-static:
        condition: service_healthy

# ---------- Network and storage ----------

networks:
  rag-net:
    driver: bridge

volumes:
  pgdata:
