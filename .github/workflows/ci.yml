# Builds every module and runs the tests on each pull request and on every push to main.
# Tests that need PostgreSQL or an LLM key are skipped here (they run only with RUN_INTEGRATION_TESTS=true).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test all modules
        run: mvn -B verify
