# Story 4: post-retrieval (reranking, neighbor stitching, citations, evaluation)
# Skeleton: health check and Eureka registration only. Port 8080 in Docker (SERVER_PORT), 8084 when run locally.
server:
  port: 8084

spring:
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  application:
    name: retrieval-post

app:
  rerank:
    top-k: ${RERANK_TOP_K:5}
  stitch:
    token-budget: ${STITCH_TOKEN_BUDGET:2000}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
